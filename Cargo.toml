[package]
name = "atfq"
version = "0.1.0"
edition = "2021"
description = "A Linux companion for the terminal: short answers first, your machine's real state second."

[[bin]]
name = "idk"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
include_dir = "0.7"
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
rmcp = { version = "3.5", features = ["server", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt", "macros", "io-std"] }

[dev-dependencies]
insta = "1"
