# Push a tag such as v0.1.0 to build static Linux binaries, attest their build
# provenance (Sigstore) and open a draft release with them. Review the draft on
# GitHub, then publish it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          # Static musl binaries: no glibc floor, so they run on every
          # distribution, Alpine included (distroproof.toml checks it).
          - { os: ubuntu-22.04, arch: x86_64 }
          - { os: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup target add "$TARGET"
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | sed -n 's/.*"name":"atfq","version":"\([^"]*\)".*/\1/p')
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME, but Cargo.toml says $version"; exit 1; }
      - run: cargo test --locked
      - run: cargo build --release --locked --target "$TARGET"
      - name: Check that the binary is static
        run: |
          file "target/$TARGET/release/atfq" | grep -Eq 'statically linked|static-pie linked'
          "target/$TARGET/release/atfq" --version
      - name: Package
        run: |
          dir=atfq-${{ matrix.arch }}-linux
          mkdir "$dir"
          cp "target/$TARGET/release/atfq" README.md LICENSE-MIT LICENSE-APACHE "$dir"/
          tar czf "$dir.tar.gz" "$dir"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: atfq-${{ matrix.arch }}-linux.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: atfq-${{ matrix.arch }}-linux
          path: atfq-${{ matrix.arch }}-linux.tar.gz

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum *.tar.gz > SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "atfq $GITHUB_REF_NAME" --generate-notes
