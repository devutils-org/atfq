# The static build and the published release of atfq, side by side, in each VM.
# sh scripts/distroproof/build.sh
# distroproof up --no-tui --jobs 4 --json dist/matrix.json
# python3 scripts/distroproof/summary.py dist/matrix.json
[defaults]
memory = "1G"
cpus = 2
timeout = "10m"

[[target]]
name = "debian-10"
image = "debian-10"

[[target]]
name = "debian-11"
image = "debian-11"

[[target]]
name = "debian-12"
image = "debian-12"

[[target]]
name = "debian-13"
image = "debian-13"

[[target]]
name = "debian-sid"
image = "debian-sid"

[[target]]
name = "ubuntu-18.04"
image = "ubuntu-18.04"

[[target]]
name = "ubuntu-20.04"
image = "ubuntu-20.04"

[[target]]
name = "ubuntu-22.04"
image = "ubuntu-22.04"

[[target]]
name = "ubuntu-24.04"
image = "ubuntu-24.04"

[[target]]
name = "rocky-8"
image = "rocky-8"

[[target]]
name = "rocky-9"
image = "rocky-9"

[[target]]
name = "fedora-previous"
image = "fedora-previous"

[[target]]
name = "fedora-latest"
image = "fedora-latest"

[[target]]
name = "arch"
image = "arch"

[[target]]
name = "alpine"
image = "alpine"

[[target]]
name = "nixos"
image = "nixos"

[[target]]
name = "gentoo"
image = "gentoo"
memory = "2G"
timeout = "20m"

# Probes that need privileges, and a kernel that hides more from root.
[[target]]
name = "debian-12-root"
image = "debian-12"
as_user = "root"

[[target]]
name = "fedora-lockdown"
image = "fedora-latest"
kernel_cmdline = "lockdown=confidentiality"

[run]
command = "sh scripts/distroproof/sweep.sh"
as_user = "test"
collect = ["cell.json"]
exclude = ["*"]
include = ["dist/distroproof", "scripts/distroproof"]
